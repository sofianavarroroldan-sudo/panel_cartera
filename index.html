 (n<8?`<p class="mut">Hay solo ${n} observaciones: volatilidad, Sharpe y alfa son poco fiables hasta tener más fechas. Se completarán solas con las actualizaciones diarias.</p>`:'')+
 `<div class="g2"><div class="c"><h2>Evolución (base 100)</h2><canvas id="c1"></canvas></div><div class="c"><h2>Contribución a la rentabilidad (puntos)</h2><canvas id="c2"></canvas></div></div>`+
 `<div class="g2"><div class="c"><h2>Estado de la decisión</h2><div class="tl"><span>Activos a revisar</span>${tg(rv?'dn':'ok',rv)}</div><div class="tl"><span>Pesos a ajustar o vigilar</span>${tg(aj?'wa':'ok',aj)}</div><div class="tl"><span>Reglas del concurso incumplidas</span>${tg(bad?'dn':'ok',bad)}</div><div class="tl"><span>Días hasta la ventana (${fd(S.cfg.win1)})</span><b>${days(S.cfg.win1)}</b></div><p><button class="p" onclick="go('dec')">Ir a Decisión →</button></p></div><div class="c"><h2>Reparto por tipo de activo</h2><canvas id="c3"></canvas></div></div>`}

function vEvo(X){const{D,V,Bn,mb,dd}=X;
 const rows=D.map((d,t)=>`<tr><td>${fd(d)}</td><td>${E(V[t])}</td><td class="${cl(t&&V[t]/V[t-1]-1)}">${t?P((V[t]/V[t-1]-1)*100):'—'}</td><td class="${cl(V[t]-V[0])}">${P((V[t]/V[0]-1)*100)}</td>${Bn.map(s=>`<td>${s?P(s[t]-100):'n/d'}</td>`).join('')}</tr>`).reverse().join('');
 return`<div class="c"><h2>Cartera frente a los índices (base 100 en la fecha de inicio)</h2><canvas id="c1"></canvas></div><div class="g2"><div class="c"><h2>Caída desde máximos (%)</h2><canvas id="c4"></canvas></div><div class="c"><h2>Lectura rápida</h2><p>Si la línea azul oscura queda <b>por encima</b> del índice, la cartera gana al mercado. Una caída mayor que la del índice indica más riesgo del necesario.</p><p class="mut">Los índices son ETF de referencia (MSCI World y S&amp;P 500, precio de cierre en euros) y se actualizan solos.</p></div></div><div class="c w" style="margin-top:14px"><h2>Histórico</h2><table><tr><th>Fecha</th><th>Valor</th><th>Día</th><th>Acumulado</th>${S.cfg.bn.map(b=>`<th>${esc(b)}</th>`).join('')}</tr>${rows}</table></div>`}

function vPos(X){const{A}=X;
 const rows=A.map(a=>`<tr><td>${esc(a.h.n)}<br><small>${esc(a.h.i)}</small></td><td>${esc(a.h.c)}</td><td>${esc(a.h.r)}</td><td>${F(a.h.q,0)}</td><td>${F(a.h.p,2)} ${a.h.u}</td><td>${F(a.pl,2)}</td><td class="${cl(a.tot)}">${P(a.tot)}</td><td class="${cl(a.rel)}">${P(a.rel)}</td><td class="${cl(a.con)}">${P(a.con)}</td><td>${F(a.w0,1)} %</td><td>${F(a.w,1)} %</td><td>${tg(a.t,a.s)}</td></tr>`).join('');
 return`<div class="c w"><h2>Posiciones</h2><table><tr><th>Activo</th><th>Tipo</th><th>Región</th><th>Títulos</th><th>P. compra</th><th>P. actual</th><th>Rent.</th><th>vs índice (pp)</th><th>Contrib. (pp)</th><th>Peso ini.</th><th>Peso act.</th><th>Señal</th></tr>${rows}</table></div><div class="g2"><div class="c"><h2>Rentabilidad por activo (%)</h2><canvas id="c5"></canvas></div><div class="c"><h2>Peso inicial frente a actual (%)</h2><canvas id="c6"></canvas></div></div>`}

function vRis(X){const{A,mp,mb,n}=X;
 const r=(l,f)=>`<tr><td>${l}</td><td>${f(mp)}</td>${mb.map(m=>`<td>${m?f(m):'n/d'}</td>`).join('')}</tr>`;
 const sm=A.length&&n>=5?`<div class="c w" style="margin-top:14px"><h2>Correlación entre activos (rentabilidades diarias)</h2><table><tr><th></th>${A.map(a=>`<th>${esc(sh(a.h).slice(0,9))}</th>`).join('')}</tr>${A.map(a=>`<tr><td>${esc(sh(a.h))}</td>${A.map(b=>{const c=cor(a.r,b.r);return`<td style="background:rgba(37,99,235,${isFinite(c)?Math.max(0,Math.abs(c)*.55):0});color:${Math.abs(c)>.6?'#fff':'inherit'}">${F(c,2)}</td>`}).join('')}</tr>`).join('')}</table><p class="mut">Cuanto más oscuro, más se mueven juntos: eso resta diversificación.</p></div>`:`<p class="mut">La matriz de correlaciones aparece con 5 o más observaciones.</p>`;
 const cat=Object.entries(X.cat).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${E(v)}</td><td>${F(v/X.V[X.V.length-1]*100,1)} %</td></tr>`).join('');
 return`<div class="c w"><h2>Métricas de riesgo y rentabilidad ajustada</h2><table><tr><th></th><th>Cartera</th>${S.cfg.bn.map(b=>`<th>${esc(b)}</th>`).join('')}</tr>${r('Rentabilidad',m=>P(m.tot))}${r('Volatilidad anual.',m=>isFinite(m.vol)?F(m.vol,1)+' %':'n/d')}${r('Sharpe',m=>F(m.sh))}${r('Caída máxima',m=>P(m.mdd))}${r('Beta (vs índice 1)',m=>m.beta==null?'—':F(m.beta))}${r('Correlación (vs índice 1)',m=>m.cor==null?'—':F(m.cor))}${r('Alfa anualizado',m=>m.al==null?'—':P(m.al))}${r('Tracking error',m=>m.te==null?'—':F(m.te,1)+' %')}</table></div>
 <div class="g2"><div class="c w"><h2>Riesgo por activo</h2><table><tr><th>Activo</th><th>Volatilidad</th><th>Corr. vs índice</th></tr>${A.map(a=>`<tr><td>${esc(sh(a.h))}</td><td>${isFinite(a.vol)?F(a.vol,1)+' %':'n/d'}</td><td>${F(a.cb,2)}</td></tr>`).join('')}</table></div><div class="c w"><h2>Exposiciones</h2><table><tr><th>Tipo</th><th>Importe</th><th>Peso</th></tr>${cat}</table><p>Exposición a líneas en dólares: <b>${F(X.usd,1)} %</b></p><p class="mut">La concentración principal de la cartera está en renta variable de EE. UU. (tecnología y comunicación). Vigilad que no dominen la volatilidad.</p></div></div>${sm}`}

function vDec(X){const{A,chk,mp,mb}=X,b=mb[0];
 const ev=[[S.cfg.start,'Inicio de la cartera'],['2026-10-29','Reunión del BCE (tipos)'],[S.cfg.win1,'1.ª ventana de cambios'],[S.cfg.win2,'2.ª ventana de cambios'],['2026-12-17','Reunión del BCE'],[S.cfg.end,'Cierre de cartera'],['2027-02-11','Sesión final y premios']].map(x=>`<div class="tl"><span>${fd(x[0])}/${x[0].slice(0,4)} · ${x[1]}</span><b class="${days(x[0])<0?'mut':''}">${days(x[0])<0?'pasado':'en '+days(x[0])+' d'}</b></div>`).join('');
 const cmp=b?[['Sharpe (peso 40 %)',mp.sh,b.sh,1,40],['Volatilidad (25 %)',mp.vol,b.vol,0,25],['Alfa (25 %)',mp.al,0,1,25],['Correlación (10 %)',mp.cor,b.cor==null?mp.cor:.999,0,10]]:[];
 let pts=0;const cr=cmp.map(c=>{const g=isFinite(c[1])&&(c[3]?c[1]>c[2]:c[1]<c[2]);if(g)pts+=c[4];return`<tr><td>${c[0]}</td><td>${F(c[1])}</td><td>${c[0].startsWith('Alfa')?'0':F(c[2])}</td><td>${tg(g?'ok':'wa',g?'mejor':'peor')}</td></tr>`}).join('');
 return`<div class="g2"><div class="c"><h2>1 · Reglas del concurso</h2>${chk.map(x=>`<div class="tl"><span>${x[0]}<br><small>${x[2]}</small></span>${tg(x[1]?'ok':'dn',x[1]?'OK':'REVISAR')}</div>`).join('')}</div><div class="c"><h2>Calendario</h2>${ev}<p class="mut">Contexto a 13/10: depósito del BCE 2,50 %, inflación de la zona euro 3,3 %. Actualizad este dato antes de decidir.</p></div></div>
 <div class="c w" style="margin-top:14px"><h2>2 · Señal por activo</h2><table><tr><th>Activo</th><th>Rent.</th><th>vs índice</th><th>Peso</th><th>Señal</th><th style="text-align:left">Motivo</th></tr>${A.map(a=>`<tr><td>${esc(sh(a.h))}</td><td class="${cl(a.tot)}">${P(a.tot)}</td><td class="${cl(a.rel)}">${P(a.rel)}</td><td>${F(a.w,1)} %</td><td>${tg(a.t,a.s)}</td><td style="text-align:left">${a.why}</td></tr>`).join('')}</table><p class="mut">Reglas de las señales: REVISAR = rinde más de 5 pp por debajo del índice y resta; AJUSTAR = peso fuera de 5-10 %; VIGILAR = gana más de 5 pp y pesa más del 9 %. Son avisos, no órdenes.</p></div>
 <div class="g2"><div class="c w"><h2>3 · Cartera frente al índice (estimación de la categoría 2)</h2><table><tr><th>Métrica</th><th>Cartera</th><th>Índice</th><th></th></tr>${cr}</table><p>Puntos estimados frente al índice: <b>${pts} / 100</b></p><p class="mut">Solo orienta: la clasificación real depende de las demás carteras y de cómo calcule ISEFI.</p></div>
 <div class="c w"><h2>4 · Rebalanceo a pesos iniciales</h2><table><tr><th>Activo</th><th>Acción</th><th>Títulos</th></tr>${A.map(a=>`<tr><td>${esc(sh(a.h))}</td><td>${Math.abs(a.dq)<1?'—':a.dq>0?'Comprar':'Vender'}</td><td>${Math.abs(a.dq)<1?'—':F(Math.abs(a.dq),0)}</td></tr>`).join('')}</table><p class="mut">Cuántos títulos mover para volver a los pesos de partida (a precios actuales).</p></div></div>
 <div class="c" style="margin-top:14px"><h2>5 · Cómo decidir el 13/11</h2><ol><li><b>¿Se rompe alguna regla?</b> Si sí, hay que corregirlo.</li><li><b>¿Qué activos restan y por qué?</b> Distinguid un motivo de fondo (tipos, sector) del ruido de pocas semanas.</li><li><b>¿Cómo va la cartera frente al índice</b> en Sharpe, volatilidad, alfa y correlación? Son los criterios de la categoría 2.</li><li><b>¿El cambio mejora esas 4 métricas</b> o solo persigue lo que acaba de subir?</li><li>Solo hay dos ventanas: no gastéis una en cambios pequeños.</li></ol></div>`}

function vDat(){const H=S.h,c=S.cfg,today=new Date().toISOString().slice(0,10);
 const inp=(id,l,v,t)=>`<div><label>${l}</label><input id="${id}" type="${t||'text'}" value="${esc(v)}"></div>`;
 return`<div class="c"><h2>Añadir un día de precios</h2><p class="mut">Precio de cada activo en euros, igual que en la cartera entregada: si cotiza en dólares, dividid el precio en USD entre el tipo de cambio del Banco de España de ese día. Dejad en blanco lo que no tengáis.</p><div class="f">${inp('f_d','Fecha',today,'date')}${inp('f_fx','EUR/USD','')}${H.map((h,i)=>inp('f_p'+i,esc(sh(h)),'')).join('')}${c.bn.map((b,j)=>inp('f_b'+j,'Índice: '+esc(b),'')).join('')}</div><button class="p" onclick="addDay()">Guardar día</button></div>
 <div class="c" style="margin-top:14px"><h2>Pegar varios días (desde Excel)</h2><p class="mut">Una fila por día, separada por tabulador o «;»: fecha (dd/mm/aaaa), EUR/USD, un precio por activo en el orden de la cartera, y los 3 índices.</p><textarea id="paste"></textarea><button class="p" onclick="imp()">Importar</button></div>
 <div class="c w" style="margin-top:14px"><h2>Cartera y parámetros</h2><table><tr><th>Activo</th><th>ISIN</th><th>Tipo</th><th>Región</th><th>Divisa</th><th>Títulos</th><th>P. compra</th><th></th></tr>${H.map((h,i)=>`<tr><td><input id="h_n${i}" value="${esc(h.n)}"></td><td><input id="h_i${i}" value="${esc(h.i)}"></td><td><select id="h_c${i}">${['RV','RF','MON'].map(o=>`<option ${o===h.c?'selected':''}>${o}</option>`).join('')}</select></td><td><input id="h_r${i}" value="${esc(h.r)}"></td><td><select id="h_u${i}">${['EUR','USD'].map(o=>`<option ${o===h.u?'selected':''}>${o}</option>`).join('')}</select></td><td><input id="h_q${i}" value="${h.q}"></td><td><input id="h_p${i}" value="${h.p}"></td><td><button class="p s" onclick="delH(${i})">✕</button></td></tr>`).join('')}</table><button class="p s" onclick="addH()">+ Añadir activo</button>
 <div class="f" style="margin-top:12px">${inp('s_st','Fecha de inicio',c.start,'date')}${inp('s_cap','Capital (€)',c.capital)}${inp('s_fx','EUR/USD de compra',c.fx0)}${inp('s_rf','Tasa libre de riesgo (%)',c.rf)}${inp('s_wi','Peso mín. (%)',c.wmin)}${inp('s_wa','Peso máx. (%)',c.wmax)}${inp('s_w1','1.ª ventana',c.win1,'date')}${inp('s_w2','2.ª ventana',c.win2,'date')}${inp('s_en','Cierre',c.end,'date')}${c.bn.map((b,j)=>inp('s_b'+j,'Índice '+(j+1),b)).join('')}</div><button class="p" onclick="saveC()">Guardar cartera y parámetros</button></div>
 <div class="c" style="margin-top:14px"><h2>Copia de seguridad</h2><textarea id="bk" readonly>${esc(JSON.stringify(S))}</textarea><textarea id="rs" placeholder="Pegad aquí una copia para restaurar"></textarea><button class="p s" onclick="rest()">Restaurar</button></div>`}
const num=v=>parseFloat(String(v).replace(',','.'));
const iso=s=>{s=s.trim();return s.includes('/')?s.split('/').reverse().join('-').replace(/-(\d)(?=-|$)/g,'-0$1'):s};
function addDay(){const d=$('#f_d').value;if(!d)return;const fv=num($('#f_fx').value);if(fv>0)S.fx[d]=fv;
 S.h.forEach((h,i)=>{const v=num($('#f_p'+i).value);if(v>0){(S.px[h.i]=S.px[h.i]||{})[d]=v}});
 S.cfg.bn.forEach((b,j)=>{const v=num($('#f_b'+j).value);if(v>0)S.bx[j][d]=v});
 if(!S.dates.includes(d))S.dates.push(d);save();go('evo')}
function imp(){$('#paste').value.split('\n').forEach(l=>{const c=l.split(/[\t;]/);if(c.length<3)return;const d=iso(c[0]);if(!/^\d{4}-\d\d-\d\d$/.test(d))return;
 const fv=num(c[1]);if(fv>0)S.fx[d]=fv;S.h.forEach((h,i)=>{const v=num(c[2+i]);if(v>0)(S.px[h.i]=S.px[h.i]||{})[d]=v});S.cfg.bn.forEach((b,j)=>{const v=num(c[2+S.h.length+j]);if(v>0)S.bx[j][d]=v});if(!S.dates.includes(d))S.dates.push(d)});save();go('evo')}
function addH(){S.h.push({n:'Nuevo activo',i:'',c:'RV',r:'',u:'EUR',q:0,p:1});render()}
function delH(i){S.h.splice(i,1);render()}
function saveC(){S.h=S.h.map((h,i)=>({n:$('#h_n'+i).value,i:$('#h_i'+i).value.trim(),c:$('#h_c'+i).value,r:$('#h_r'+i).value,u:$('#h_u'+i).value,q:num($('#h_q'+i).value)||0,p:num($('#h_p'+i).value)||1}));
 const c=S.cfg;c.start=$('#s_st').value||c.start;c.capital=num($('#s_cap').value)||c.capital;c.fx0=num($('#s_fx').value)||c.fx0;c.rf=num($('#s_rf').value);c.wmin=num($('#s_wi').value);c.wmax=num($('#s_wa').value);c.win1=$('#s_w1').value;c.win2=$('#s_w2').value;c.end=$('#s_en').value;c.bn=c.bn.map((b,j)=>$('#s_b'+j).value);S.prov=0;save();go('res')}
function rest(){try{S=JSON.parse($('#rs').value);save();go('res')}catch(e){alert('No se ha podido leer la copia.')}}

function mk(id,cfg){const e=document.getElementById(id);if(!e)return;if(CH[id])CH[id].destroy();CH[id]=new Chart(e,cfg)}
function charts(X){const st=getComputedStyle(document.documentElement),g=v=>st.getPropertyValue(v).trim();Chart.defaults.color=g('--mut');Chart.defaults.borderColor=g('--line');Chart.defaults.font.family="'IBM Plex Sans',system-ui,sans-serif";
 const L=X.D.map(fd),cs=[g('--b2'),g('--mut'),g('--b3'),g('--wa')],pt=X.D.length<40?3:0;
 const ds=[{label:'Cartera',data:X.V.map(v=>v/X.V[0]*100),borderColor:g('--b1'),backgroundColor:g('--b1'),borderWidth:3,tension:.2,pointRadius:pt}];
 X.Bn.forEach((s,j)=>{if(s)ds.push({label:S.cfg.bn[j],data:s,borderColor:cs[j+1],backgroundColor:cs[j+1],borderWidth:1.6,borderDash:j?[5,4]:[],tension:.2,pointRadius:pt})});
 const line={type:'line',data:{labels:L,datasets:ds},options:{responsive:true,interaction:{mode:'index',intersect:false}}};
 mk('c1',line);
 mk('c2',{type:'bar',data:{labels:X.A.map(a=>sh(a.h)),datasets:[{data:X.A.map(a=>a.con),backgroundColor:X.A.map(a=>a.con>=0?g('--b2'):g('--dn'))}]},options:{indexAxis:'y',plugins:{legend:{display:false}}}});
 const ck=Object.keys(X.cat);mk('c3',{type:'doughnut',data:{labels:ck,datasets:[{data:ck.map(k=>X.cat[k]),backgroundColor:[g('--b1'),g('--b3'),'#94A3B8','#CBD5E1','#1E3A8A']}]},options:{plugins:{legend:{position:'bottom'}}}});
 mk('c4',{type:'line',data:{labels:L,datasets:[{label:'Caída',data:X.dd,borderColor:g('--dn'),backgroundColor:g('--dn')+'33',fill:true,tension:.2,pointRadius:pt}]},options:{plugins:{legend:{display:false}}}});
 mk('c5',{type:'bar',data:{labels:X.A.map(a=>sh(a.h)),datasets:[{label:'Activo',data:X.A.map(a=>a.tot),backgroundColor:g('--b2')},{label:S.cfg.bn[0],data:X.A.map(()=>X.mb[0]?X.mb[0].tot:0),backgroundColor:g('--mut')}]},options:{indexAxis:'y'}});
 mk('c6',{type:'bar',data:{labels:X.A.map(a=>sh(a.h)),datasets:[{label:'Inicial',data:X.A.map(a=>a.w0),backgroundColor:g('--b3')},{label:'Actual',data:X.A.map(a=>a.w),backgroundColor:g('--b1')}]}})}
const TABS=[['res','Resumen'],['evo','Evolución'],['pos','Posiciones'],['ris','Riesgo'],['dec','Decisión']];
function render(){$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===T?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 const X=build();$('#m').innerHTML=({res:vRes,evo:vEvo,pos:vPos,ris:vRis,dec:vDec,dat:vDat})[T](X);
 if(T!=='dat'&&window.Chart)charts(X)}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(j=>{S=j;render();const m=j.meta||{};st('Datos hasta '+(j.dates.length?fd(j.dates[j.dates.length-1]):'—')+' · última actualización '+(m.updated?new Date(m.updated).toLocaleString('es-ES'):'—')+' · fuentes: Finect, BCE')}).catch(e=>{S=SEED;render();st('No se pudo leer data.json: se muestran los datos iniciales')});
</script></body></html>

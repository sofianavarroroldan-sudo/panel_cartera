name: Actualizar datos de la cartera
on:
  schedule:
    - cron: "0 7,13,19 * * 1-6"   # tres veces al dia, de lunes a sabado (hora UTC)
  workflow_dispatch:               # boton "Run workflow" para lanzarlo a mano
permissions:
  contents: write
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 yfinance
      - run: python scripts/update.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Actualiza datos $(date -u '+%Y-%m-%d %H:%M')" && git push)
